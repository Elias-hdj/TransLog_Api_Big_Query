name: TransLog Pipeline Quotidien

on:
  schedule:
    # Tous les jours à 5h UTC = 7h Paris (heure d'été) / 6h Paris (hiver)
    - cron: '0 5 * * *'
  workflow_dispatch:  # déclenchement manuel depuis l'onglet Actions

jobs:
  collect-and-load:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
    python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer le pipeline
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY_B64: ${{ secrets.GCP_SA_KEY_B64 }}
        run: python pipeline.py

      - name: Résumé
        if: always()
        run: |
          echo "## Résultat du pipeline TransLog" >> $GITHUB_STEP_SUMMARY
          echo "- Statut : ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Date : $(date -u)" >> $GITHUB_STEP_SUMMARY